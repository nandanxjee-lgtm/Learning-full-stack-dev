<!DOCTYPE html>
<html>
<head>
    <title>SXC Admission Form</title>
</head>

<body>

<header>
    <center>
        <h1>ST. XAVIER'S COLLEGE</h1>
        <h3>Admission Form</h3>
    </center>
</header>

<main>
<section>

    <p><b>NAME:</b></p>
    <input type="text" placeholder="Name">
    <br><br>

    <p><b>FATHER'S NAME:</b></p>
    <input type="text" placeholder="Father's Name">
    <br><br>

    <p><b>MOTHER'S NAME:</b></p>
    <input type="text" placeholder="Mother's Name">
    <br><br>

    <p><b>Date of Birth:</b></p>
    <input type="text" placeholder="DD/MM/YYYY">
    <br><br>

</section>

<section>

    <p><b>Taking Admission In:</b></p>

    <label>
        <input type="radio" name="class" value="class10">
        Class X
    </label>

    <label>
        <input type="radio" name="class" value="class12">
        Class XII
    </label>

    <br><br>

    <p><b>Subject you would like to opt:</b></p>

    <label>
        <input type="checkbox" name="sub" value="Maths">
        Maths
    </label>

    <label>
        <input type="checkbox" name="sub" value="Physics">
        Physics
    </label>

    <label>
        <input type="checkbox" name="sub" value="Chemistry">
        Chemistry
    </label>

    <br><br>

    <label>
        <input type="radio" name="stream" value="PHE">
        PHE
    </label>

    <label>
        <input type="radio" name="stream" value="Commerce">
        Commerce
    </label>

</section>

<br>

<center>
    <input type="submit" value="Submit">
</center>

</main>

<footer>
    <p>
        For any other queries you can contact us at:<br>
        Email: xyz@gmail.com<br>
        Phone number: xxxx23
    </p>
</footer>

</body>
</html>
